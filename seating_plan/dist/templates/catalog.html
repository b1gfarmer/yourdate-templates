<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Каталог шаблонов</title>
  <script type="module" src="/catalog.bundle.js"></script>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
    h1 { text-align: center; }
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .template-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }
    .template-card h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }
    .buttons {
      display: flex;
      gap: 12px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-export { background: #4CAF50; color: white; }
    .btn-preview { background: #2196F3; color: white; }
  </style>
</head>
<body>
  <h1>Каталог шаблонов рассадки</h1>
  <div id="templates" class="template-grid"></div>
</body>
</html>
