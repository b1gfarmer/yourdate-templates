<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Пример шаблона рассадки</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fffafc, #ffe8ef);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      color: #333;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      text-align: center;
      color: #b85780;
      margin-bottom: 24px;
    }

    .template-wrapper {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
    }

    .zone {
      margin-bottom: 24px;
    }

    .zone-title {
      font-weight: 600;
      font-size: 18px;
      margin-bottom: 12px;
      color: #b85780;
    }

    .guests {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .guest {
      background: #ffe3ec;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: #b85780;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .back-link:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Шаблон: Классическая рассадка</h1>

  <div class="template-wrapper">
    <div class="zone">
      <div class="zone-title">Президиум</div>
      <div class="guests">
        <div class="guest">Жених</div>
        <div class="guest">Невеста</div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-title">Стол A</div>
      <div class="guests">
        <div class="guest">Гость 1</div>
        <div class="guest">Гость 2</div>
        <div class="guest">Гость 3</div>
        <div class="guest">Гость 4</div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-title">Стол B</div>
      <div class="guests">
        <div class="guest">Гость 5</div>
        <div class="guest">Гость 6</div>
        <div class="guest">Гость 7</div>
        <div class="guest">Гость 8</div>
      </div>
    </div>
  </div>

  <a class="back-link" href="catalog.html">← Вернуться к каталогу</a>
</body>
</html>
