<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Пример шаблона рассадки</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fffafc, #ffe8ef);
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
      color: #333;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto; /* центрирование */
      padding: 0 20px; /* небольшой отступ по бокам */
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      text-align: center;
      color: #b85780;
      margin-bottom: 40px;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .table-card {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .table-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
    }

    .table-name {
      font-weight: 600;
      font-size: 20px;
      color: #b85780;
      margin-bottom: 16px;
    }

    .guest-list {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      text-align: center;
    }

    .guest-list li {
      background: #ffe3ec;
      margin: 6px 0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: #b85780;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    .presidium-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 40px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>Шаблон: Классическая рассадка</h1>

      <!-- Президиум отдельно -->
    <div class="presidium-wrapper">
      <div class="table-card">
        <div class="table-name">Президиум</div>
        <ul class="guest-list">
          <li>Жених</li>
          <li>Невеста</li>
        </ul>
      </div>
    </div>

    <div class="tables-grid">

      <div class="table-card">
        <div class="table-name">Родственники Жениха</div>
        <ul class="guest-list">
          <li>Гость 1</li>
          <li>Гость 2</li>
          <li>Гость 3</li>
          <li>Гость 4</li>
        </ul>
      </div>

      <div class="table-card">
        <div class="table-name">Родственники Невесты</div>
        <ul class="guest-list">
          <li>Гость 5</li>
          <li>Гость 6</li>
          <li>Гость 7</li>
          <li>Гость 8</li>
        </ul>
      </div>

      <div class="table-card">
        <div class="table-name">Друзья</div>
        <ul class="guest-list">
          <li>Гость 9</li>
          <li>Гость 10</li>
          <li>Гость 11</li>
        </ul>
      </div>
    </div>

    <a class="back-link" href="catalog.html">← Вернуться к каталогу</a>

  </div>
  
</body>
</html>
