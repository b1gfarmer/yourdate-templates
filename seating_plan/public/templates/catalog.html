<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Каталог шаблонов</title>
  <script type="module" src="/catalog.bundle.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      padding: 40px;
      background: linear-gradient(135deg, #fffdfe, #f1e5e8);
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      text-align: center;
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      color: #b85780;
      margin-bottom: 40px;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .template-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .template-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
    }

    .template-card h2 {
      margin: 0 0 20px;
      font-size: 20px;
      color: #333;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .btn-export {
      background: #c77d8c;
      color: white;
    }

    .btn-preview {
      background: #a0c4ff;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Каталог шаблонов рассадки</h1>
  <div id="templates" class="template-grid"></div>
</body>
</html>
